services:
  financekitsync:
    build: .
    image: financekitsync:latest
    container_name: financekitsync
    restart: unless-stopped
    # Host networking, bound to the host's loopback only: Box API forwards the
    # namespaced RPC routes here, and this container reaches Box API's /notify
    # on 127.0.0.1:8444 for identity tripwires. Nothing listens beyond loopback.
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8501", "--workers", "1"]
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
