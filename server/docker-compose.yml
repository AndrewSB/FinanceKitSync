services:
  financekitsync:
    build: .
    image: financekitsync:latest
    container_name: financekitsync
    restart: unless-stopped
    # Bound to loopback only. Public reachability comes from Tailscale Funnel
    # on the host, which proxies to this port — the container itself is never
    # directly exposed.
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
